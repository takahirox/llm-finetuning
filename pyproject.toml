[project]
name = "llm-finetuning"
version = "0.1.0"
description = "Reproducible Qwen2.5 LoRA shipment JSON extraction on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub==2.2.0",
    "mlx==0.32.3",
    "mlx-lm==0.32.0",
    "pydantic==2.12.3",
]

[project.optional-dependencies]
study = [
    "pyarrow==23.0.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
